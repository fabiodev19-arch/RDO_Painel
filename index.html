<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM · Painel RDO</title>
<meta name="theme-color" content="#123F5C">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --surface-3:#E8ECEF;
    --border:#C7D0D8; --text:#1A2126; --text-dim:#5A6570;
    --brand:#0E7BA6; --brand-dark:#123F5C;
    --accent:#C96010; --accent-dark:#A6500C;
    --success:#1F8C4C; --success-bg:rgba(31,140,76,.10);
    --danger:#C23B32; --danger-bg:rgba(194,59,50,.10);
    --radius:4px; --radius-sm:3px;
    --shadow:none;
  }
  html[data-theme="dark"]{
    --bg:#0B1620; --surface:#112430; --surface-2:#16303F; --surface-3:#1C3B4D;
    --border:#22404F; --text:#EAF2F6; --text-dim:#8FA6B2;
    --accent:#E8871E; --accent-dark:#C96010;
    --success:#2FA65A; --success-bg:rgba(47,166,90,.15);
    --danger:#D6534A; --danger-bg:rgba(214,83,74,.15);
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  svg{width:18px; height:18px; flex-shrink:0;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .hidden{display:none !important;}
  #app{min-height:100vh; display:flex; flex-direction:row;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex-shrink:0; background:var(--brand-dark); color:#fff;
    display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{display:flex; align-items:center; gap:10px; padding:4px 8px 26px;}
  .sidebar-brand img{width:32px; height:32px; border-radius:50%; background:#fff; flex-shrink:0;}
  .sidebar-brand h1{font-size:14.5px; margin:0; font-weight:700; line-height:1.25;}
  .sidebar-brand p{font-size:11px; margin:1px 0 0; color:rgba(255,255,255,.6);}
  .sidebar-nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .sidebar-nav button{
    display:flex; align-items:center; gap:11px; text-align:left; background:none; border:none;
    color:rgba(255,255,255,.72); font-size:13.5px; font-weight:600; padding:10px 12px; border-radius:9px;
    width:100%;
  }
  .sidebar-nav button svg{width:17px; height:17px; flex-shrink:0; opacity:.85;}
  .sidebar-nav button.active{background:rgba(255,255,255,.15); color:#fff;}
  .sidebar-nav button.active svg{opacity:1;}
  .sidebar-nav button:hover:not(.active){background:rgba(255,255,255,.07);}
  .sidebar-footer{display:flex; align-items:center; justify-content:space-between; padding-top:14px; margin-top:14px; border-top:1px solid rgba(255,255,255,.12);}
  .sidebar-footer .btn-sair{background:none; border:none; color:rgba(255,255,255,.72); font-size:12.5px; font-weight:600; padding:8px 10px;}
  .icon-btn{
    background:rgba(255,255,255,.12); border:none; color:#fff; width:32px; height:32px;
    border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-btn svg{width:16px; height:16px;}

  main.app-main{flex:1; min-width:0; padding:32px 40px;}

  .btn{padding:11px 18px; border-radius:var(--radius-sm); border:none; font-size:14px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:disabled{background:var(--surface-3); color:var(--text-dim); cursor:default;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-sm{padding:7px 12px; font-size:12.5px;}
  .btn-block{width:100%;}

  /* ---------- Auth ---------- */
  .auth-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:32px; width:100%; max-width:380px; box-shadow:var(--shadow);
  }
  .auth-card img.auth-logo{width:56px; height:56px; border-radius:50%; display:block; margin:0 auto 18px;}
  .qr-wrap img{width:240px; height:240px; display:block;}
  .auth-card h2{text-align:center; font-size:19px; margin:0 0 6px;}
  .auth-card .sub{text-align:center; font-size:13px; color:var(--text-dim); margin:0 0 26px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
  .field input{
    width:100%; padding:12px 13px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14.5px;
  }
  .field input:focus{outline:none; border-color:var(--brand);}
  .field input.codigo-mfa{letter-spacing:6px; font-size:20px; text-align:center; font-weight:700;}
  .auth-erro{background:var(--danger-bg); color:var(--danger); font-size:13px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:16px;}
  .qr-wrap{display:flex; justify-content:center; margin:0 auto 16px; background:#fff; border-radius:var(--radius-sm); padding:16px; width:fit-content;}
  .qr-wrap svg{width:240px; height:240px;}
  .secret-manual{font-size:11.5px; color:var(--text-dim); text-align:center; word-break:break-all; margin:0 0 20px; font-family:monospace;}
  .auth-link{background:none; border:none; color:var(--brand); font-size:12.5px; font-weight:600; display:block; margin:14px auto 0;}
  html[data-theme="light"] .auth-link{color:var(--brand-dark);}

  /* ---------- KPIs ---------- */
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px;}
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .kpi-card .valor{font-size:26px; font-weight:800; margin:0 0 2px;}
  .kpi-card .label{font-size:12px; color:var(--text-dim); margin:0;}

  /* ---------- Filtros ---------- */
  .filtros-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; align-items:flex-end;}
  .filtro-campo{display:flex; flex-direction:column; gap:5px;}
  .filtro-campo label{font-size:11.5px; font-weight:600; color:var(--text-dim);}
  .filtro-campo input, .filtro-campo select{
    padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13.5px; min-width:140px;
  }

  /* ---------- Tabela ---------- */
  .filtro-campo-select{
    padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13px;
  }
  td input[type="checkbox"]{width:17px; height:17px; cursor:pointer;}
  .tabela-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  table{width:100%; border-collapse:collapse;}
  /* Tabelas de Configurações têm poucas colunas -- sem isso, table{width:100%}
     estica cada coluna proporcionalmente e os checkboxes ficam com vãos
     enormes entre si, dando a sensação de "informação esparsa no meio de
     muito espaço vazio". Aqui a tabela só ocupa o que o conteúdo pede. */
  .tabela-estreita{max-width:640px;}
  .tabela-matriz-scroll{overflow-x:auto;}
  .tabela-matriz{width:auto;}
  .tabela-matriz th, .tabela-matriz td{white-space:nowrap;}
  .tabela-matriz th:first-child, .tabela-matriz td:first-child{min-width:150px; white-space:normal;}
  .tabela-matriz th:not(:first-child), .tabela-matriz td:not(:first-child){width:130px; text-align:center;}
  .th-cliente{margin-bottom:6px;}
  .th-acoes-coluna{display:flex; flex-direction:column; gap:3px;}
  .btn-coluna{
    padding:3px 6px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:10.5px; font-weight:600;
    text-transform:none; letter-spacing:0; cursor:pointer; white-space:nowrap;
  }
  .btn-coluna:hover{background:var(--surface-3); color:var(--text);}
  .config-row{display:flex; align-items:flex-start; gap:32px; flex-wrap:wrap;}
  .config-section{min-width:0;}
  th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-dim);
    padding:10px 14px; border:1px solid var(--border); background:var(--surface-2);
  }
  td{padding:10px 14px; border:1px solid var(--border); font-size:13.5px;}
  tbody tr:nth-child(even){background:var(--surface-2);}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--surface-3);}
  .empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}

  /* ---------- Detalhe ---------- */
  .back-link{background:none; border:none; color:var(--text-dim); font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; margin-bottom:18px;}
  .detalhe-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:22px;}
  .info-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .info-card label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:3px;}
  .info-card .val{font-size:14.5px; font-weight:600;}
  .section-title{font-size:17px; font-weight:700; color:var(--text); margin:28px 0 4px;}
  .helper-text{font-size:13px; color:var(--text-dim); margin:0 0 14px; max-width:640px; line-height:1.5;}
  .ativ-detalhe{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  .ativ-detalhe .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .ativ-detalhe .tipo{font-weight:700; font-size:14.5px;}
  .ativ-detalhe .campos{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:10px;}
  .ativ-detalhe .campos .item label{font-size:10.5px; color:var(--text-dim); display:block;}
  .ativ-detalhe .campos .item .v{font-size:13.5px; font-weight:600;}
  .badge-revisao{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .badge-revisao.pendente{background:var(--surface-3); color:var(--text-dim);}
  .badge-revisao.validado{background:var(--success-bg); color:var(--success);}
  .badge-revisao.devolvido{background:var(--danger-bg); color:var(--danger);}
  .badge-revisao.removido{background:var(--surface-3); color:var(--text-dim); text-decoration:line-through;}
  /* Borda tracejada e opacidade: a atividade removida tem que ser lida como
     "isto não está mais no aparelho" antes de qualquer texto ser lido. */
  .ativ-detalhe.removida{opacity:.72; border-style:dashed;}
  .ativ-detalhe.removida .tipo{text-decoration:line-through;}
  .ativ-aviso-remocao{
    font-size:12.5px; color:var(--text-dim); background:var(--surface-3); border-radius:var(--radius-sm);
    padding:8px 10px; margin-top:10px;
  }
  .ativ-motivo-devolucao{
    font-size:12.5px; color:var(--danger); background:var(--danger-bg); border-radius:var(--radius-sm);
    padding:8px 10px; margin-top:10px;
  }
  .ativ-acoes-revisao{display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);}
  .lista-inline{font-size:13px; color:var(--text); margin:0;}
  .fotos-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .fotos-grid img{width:84px; height:84px; object-fit:cover; border-radius:9px; border:1px solid var(--border); cursor:pointer;}
  .badge{font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px;}
  .badge.sincronizado{background:var(--success-bg); color:var(--success);}

  /* ---------- Cadastros ---------- */
  .cadastros-layout{display:grid; grid-template-columns:210px 1fr; gap:20px; align-items:start;}
  .cad-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .cad-toolbar-hint{font-size:12px; color:var(--text-dim);}
  .cad-sidebar{
    display:flex; flex-direction:column; gap:2px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:8px;
  }
  .cad-sidebar-item{
    text-align:left; background:none; border:none; color:var(--text-dim); font-size:13px; font-weight:600;
    padding:10px 12px; border-radius:9px;
  }
  .cad-sidebar-item:hover:not(.active){background:var(--surface-2);}
  .cad-sidebar-item.active{background:var(--brand); color:#fff;}
  html[data-theme="light"] .cad-sidebar-item.active{background:var(--brand-dark);}
  .cad-content{min-width:0;}
  .cad-add-row{display:flex; gap:8px; margin-bottom:16px;}
  .cad-add-row input{flex:1; padding:11px 13px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px;}
  .cad-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:10px;}
  .tabela-tradicional{width:100%; border-collapse:collapse; border:1px solid var(--border);}
  .tabela-tradicional th, .tabela-tradicional td{border:1px solid var(--border); padding:9px 14px; text-align:left; font-size:13.5px;}
  .tabela-tradicional th{background:var(--surface-2); font-weight:700; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.02em;}
  .tabela-tradicional tbody tr:nth-child(even){background:var(--surface-2);}
  .tabela-tradicional tbody tr:hover{background:var(--surface-3);}
  .tabela-tradicional tr.linha-inativa td:first-child{color:var(--text-dim); text-decoration:line-through;}
  .btn-tabela{
    padding:5px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:12px; font-weight:600; cursor:pointer;
  }
  .btn-tabela:hover{background:var(--surface-3);}
  .btn-tabela.perigo{border-color:var(--danger); color:var(--danger);}
  .btn-tabela.perigo:hover{background:var(--danger-bg);}
  .celula-acoes-icone{display:flex; gap:8px; align-items:center; white-space:nowrap;}
  .acao-icone{background:none; border:none; padding:2px; cursor:pointer; color:var(--text-dim);}
  .acao-icone svg{width:16px; height:16px;}
  .acao-icone:hover{color:var(--text);}
  .acao-icone.perigo{color:var(--danger);}
  .acao-icone.perigo:hover{color:var(--danger); opacity:.7;}
  .acao-icone.sucesso{color:var(--success);}
  .cad-paginacao{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .btn-pagina{
    width:28px; height:28px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:13px; cursor:pointer;
  }
  .btn-pagina:disabled{opacity:.4; cursor:default;}
  .btn-pagina:not(:disabled):hover{background:var(--surface-3);}
  .cad-paginacao-info{font-size:12.5px; color:var(--text-dim); margin:0 4px;}
  .cad-paginacao-total{font-size:12.5px; color:var(--text-dim); margin-left:auto;}

  /* ---------- Toast / Modal ---------- */
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--surface-3); color:var(--text);
    padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:40;
  }
  .toast.show{opacity:1;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
    padding:24px; opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:30;
  }
  .modal-overlay.show{opacity:1; pointer-events:auto;}
  .modal-box{background:var(--surface); border-radius:var(--radius); padding:20px; max-width:360px; width:100%; box-shadow:var(--shadow);}
  .modal-textarea{
    width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:13.5px; font-family:inherit; resize:vertical; margin:4px 0 2px;
  }
  .modal-box h3{margin:0 0 8px; font-size:16px;}
  .modal-box p{margin:0 0 18px; font-size:13.5px; color:var(--text-dim); line-height:1.5;}
  .modal-box .actions{display:flex; gap:9px;}
  .modal-box img{max-width:100%; border-radius:var(--radius-sm); display:block;}

  .spinner-wrap{display:flex; align-items:center; justify-content:center; padding:60px;}
  .spinner{width:30px; height:30px; border:3px solid var(--surface-3); border-top-color:var(--brand); border-radius:50%; animation:girar 0.8s linear infinite;}
  @keyframes girar{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* ---------- Mapa (Leaflet) ---------- */
  .mapa-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:22px;}
  .mapa-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .mapa-titulo{font-size:15px; font-weight:700; color:var(--text);}
  .mapa-leaflet{width:100%; height:340px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border);}
  .mapa-leaflet .leaflet-container{background:var(--surface-2); font-family:inherit;}
  .mapa-leaflet .leaflet-popup-content-wrapper{background:var(--surface); color:var(--text); border-radius:var(--radius-sm); box-shadow:var(--shadow);}
  .mapa-leaflet .leaflet-popup-tip{background:var(--surface);}
  .mapa-leaflet .leaflet-popup-content{font-size:12.5px; margin:10px 12px; line-height:1.5;}
  .mapa-vazio{display:flex; align-items:center; justify-content:center; height:340px; color:var(--text-dim); font-size:13.5px; text-align:center;}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="app"></div>
<div id="modal-overlay" class="modal-overlay"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  function formatarData(iso){

  function formatarDataHora(iso){
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    function pad(n){ return n<10?"0"+n:""+n; }
    return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }

  function prosseguirAposSenha(){
    return supabaseClient.auth.mfa.listFactors().then(function(resp){
      if (resp.error){ App.erroAuth = resp.error.message; App.tela = "login"; render(); return; }
      var verificado = (resp.data.totp || []).filter(function(f){ return f.status === "verified"; })[0];

      } else {
        App.fatorId = verificado.id;
        App.tela = "mfa-verify";
        render();
        return supabaseClient.auth.mfa.challenge({ factorId: verificado.id }).then(function(r){
          if (r.error){ App.erroAuth = r.error.message; render(); return; }
          App.challengeId = r.data.id;
          render();
        });
      }
    });
  }

  // Dispara a notificação push pro USUÁRIO que lançou a atividade devolvida
  // (agora que o PWA tem login, não é mais endereçado por aparelho). Chama
  // a função (Edge Function) que roda fora do banco -- só ela sabe a chave
  // privada VAPID necessária pra assinar o envio. Isso é "melhor esforço":
  // se falhar (usuário sem inscrição, rede instável), a devolução em si já
  // foi salva no banco de qualquer forma -- o PWA também vê isso na
  // checagem ativa ao abrir/sincronizar, então a notificação é um reforço,
  // não a única forma de saber.
  function dispararPushDevolucao(usuarioId, motivo){
    // O token precisa ser o da sessão de quem está logado, não a chave anon:
    // a Edge Function chama getUser() no que recebe, e a anon é um JWT sem
    // usuário nenhum por trás -- com ela a resposta é 401 e a notificação
    // some sem deixar rastro (fetch não rejeita em 401, então nem o catch
    // abaixo dispararia).
    supabaseClient.auth.getSession().then(function(resp){
      var sessao = resp && resp.data && resp.data.session;
      if (!sessao) return;
      return fetch(SUPABASE_URL + "/functions/v1/enviar-push", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + sessao.access_token
        },
        body: JSON.stringify({
          usuario_id: usuarioId,
          titulo: "Apontamento devolvido",
          corpo: motivo
        })
      }).then(function(r){
        // Sem isto, uma falha de envio é invisível: a devolução aparece como
        // sucesso na tela e ninguém descobre que a notificação não saiu.
        if (!r.ok) console.warn("push não enviado -- HTTP " + r.status);
      });
    }).catch(function(){ /* melhor esforço -- devolução já foi salva de qualquer forma */ });
  }

  function ligarTelaLogin(){
    var usuarioEl = document.getElementById("auth-usuario");
    var senhaEl = document.getElementById("auth-senha");
    var btn = document.getElementById("btn-entrar");
    function tentar(){
      var usuario = usuarioEl.value.trim(), senha = senhaEl.value;
      if (!usuario || !senha){ App.erroAuth = "Informe usuário e senha."; render(); return; }
      // O login pede só o usuário (ex: jose.silva); o Supabase Auth exige
      // e-mail, então completamos com o domínio aqui. Se a pessoa já digitar
      // o e-mail inteiro por engano, não duplica o domínio.
      var email = usuario.indexOf("@") === -1 ? (usuario + DOMINIO_EMAIL) : usuario;
      btn.disabled = true; btn.textContent = "Entrando...";
      fazerLogin(email, senha).catch(function(err){
        // Sem isso, um erro inesperado (rede, exceção não prevista) deixava
        // o botão travado em "Entrando..." pra sempre, sem mensagem nenhuma
        // -- foi exatamente o que aconteceu no painel de biomassa.
        App.erroAuth = "Erro inesperado ao entrar: " + (err && err.message ? err.message : "tente novamente.");
        render();
      });
    }
    btn.onclick = tentar;
    [usuarioEl, senhaEl].forEach(function(el){
      el.addEventListener("keydown", function(e){ if (e.key === "Enter") tentar(); });
    });
  }

  // O enroll() do Supabase devolve o QR code como data URI
  // (data:image/svg+xml;...) na maioria das versões -- precisa virar <img>,
  // não pode ir direto no innerHTML (o navegador mostraria a string da data
  // URI como texto solto antes de achar o SVG válido dentro dela). Mantém
  // o caminho de SVG puro como fallback, caso uma versão futura mude isso.
  function renderQrCode(qrCode){
    if (!qrCode) return '<div class="spinner-wrap"><div class="spinner"></div></div>';
    if (qrCode.indexOf("data:") === 0){
      var src = qrCode;
      var virgula = qrCode.indexOf(",");
      if (virgula !== -1){
        var prefixo = qrCode.slice(0, virgula);      // ex: "data:image/svg+xml;utf-8"
        var conteudo = qrCode.slice(virgula + 1);
        // SVG cru costuma ter "#" (ex: url(#gradiente), href="#id") -- um "#"
        // sem codificar dentro de uma data URI é lido como fragmento de URL
        // e trunca tudo que vem depois, quebrando a imagem silenciosamente
        // (só aparece um pedaço, ou nada). Só recodifica se detectar SVG cru
        // (tem "<" literal) -- se já vier percent-encoded, não mexe de novo.
        if (conteudo.indexOf("<") !== -1){
          src = prefixo + "," + encodeURIComponent(conteudo);
        }
      }
      return '<div class="qr-wrap"><img src="'+esc(src)+'" width="240" height="240" alt="QR code do autenticador"></div>';
    }
    return '<div class="qr-wrap">'+qrCode+'</div>';
  }

      (r.atividades||[]).forEach(function(a){
        atividades++;
        // Volume movimentado: comprimento(m) × largura(m) × profundidade(cm→m)
        // -- só faz sentido pras atividades de obra que têm as 3 dimensões.
        if (a.comprimento_m != null && a.largura_m != null && a.profundidade_cm != null){
          volumeM3 += a.comprimento_m * a.largura_m * (a.profundidade_cm / 100);
        }
        // Horas-máquina: soma de (hora_final − hora_inicial) de cada máquina
        (a.maquinas||[]).forEach(function(m){
          if (m.hora_inicial != null && m.hora_final != null){
            horasMaquina += (m.hora_final - m.hora_inicial);
          }
        });
      });
      if (r.fazenda) fazendas[r.fazenda] = true;
    });
    return {
      relatorios: lista.length,
      atividades: atividades,
      volumeM3: volumeM3,
      horasMaquina: horasMaquina,
      fazendas: Object.keys(fazendas).length
    };
  }
  function fmtNum(n){
    return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 }).format(n);
  }
  function opcoesDistintas(lista, campo){
    var vistos = {}, out = [];
    lista.forEach(function(r){ if (r[campo] && !vistos[r[campo]]){ vistos[r[campo]] = true; out.push(r[campo]); } });
    out.sort();
    return out;
  }

  /* ---------- Mapa Leaflet ---------- */
  // Padrão idêntico ao painel de biomassa: OpenStreetMap + circleMarkers.
  // O mapa é recriado a cada render do dashboard (o innerHTML apaga o div
  // anterior), então guardamos só a instância atual pra dar destroy antes.
  var _leafletMap = null;
  function renderMapaFrentes(){
    var div = document.getElementById("mapa-leaflet");
    if (!div || typeof L === "undefined") return;
    if (_leafletMap){ try { _leafletMap.remove(); } catch(e){} _leafletMap = null; }

    var comGps = App.relatorios.filter(function(r){ return r.gps_lat != null && r.gps_lng != null; });
    if (!comGps.length) return;

    _leafletMap = L.map(div, { scrollWheelZoom: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(_leafletMap);

    var pontos = [];
    comGps.forEach(function(r){
      var marker = L.circleMarker([r.gps_lat, r.gps_lng], {
        radius: 8, color: "#fff", weight: 2, fillColor: "#E8871E", fillOpacity: 0.9
      });
      marker.bindPopup(
        "<b>"+esc(r.fazenda||"Fazenda não informada")+"</b><br>"+
        esc(r.cliente||"—")+" &middot; "+formatarData(r.data_relatorio)+"<br>"+
        (r.atividades||[]).length+" atividade(s)"
      );
      marker.on("click", function(){ App.relatorioAtualId = r.id; App.tela = "detalhe"; render(); });
      marker.addTo(_leafletMap);
      pontos.push([r.gps_lat, r.gps_lng]);
    });

    var bounds = L.latLngBounds(pontos);
    _leafletMap.fitBounds(bounds.pad(0.35), { maxZoom: 12 });
    setTimeout(function(){ if (_leafletMap) _leafletMap.invalidateSize(); }, 60);
  }

  /* ======================= RENDER: DETALHE ======================= */
  // "dados" é jsonb livre (ver migração) -- o formato aqui é reconhecido
  // pelo que a atividade realmente preencheu, não por uma lista fixa de
  // nomes de atividade, então um 4º template novo ainda renderiza de forma
  // razoável mesmo antes de eu adicionar um branch dedicado pra ele.
  function renderMaquinaDadosGenerico(dados){
    var d = dados || {};
    var partes = [];
    Object.keys(d).forEach(function(k){
      if (d[k] === null || d[k] === undefined || d[k] === "") return;
      partes.push(esc(k)+": "+esc(d[k]));
    });
    return partes.join(" · ") || "—";
  }
  function renderResumoAtividade(a){
    // Máquinas Detalhado: só esse template preenche data_execucao
    if (a.data_execucao != null){
      var itensMD = (a.maquinas||[]).map(function(m){
        var d = m.dados || {};
        return '<div class="item" style="grid-column:1/-1; border-top:1px solid var(--border); padding-top:8px; margin-top:4px;">'+
          '<label>'+esc(m.equipamento)+' — '+esc(m.operador)+'</label>'+
          '<span class="v" style="font-weight:400; font-size:12.5px;">'+
            (d.up?('UP '+esc(d.up)+' · '):'')+
            (d.trecho?('Trecho '+esc(d.trecho)+' · '):'')+
            (d.quantidade!=null?('Qtd '+esc(d.quantidade)+' · '):'')+
            esc(d.observacao||"")+
          '</span></div>';
      }).join("");
      return '<div class="campos">'+
        '<div class="item"><label>Data</label><span class="v">'+formatarData(a.data_execucao)+'</span></div>'+
      '</div>'+
      '<div class="campos" style="margin-top:6px;">'+itensMD+'</div>';
    }
    // Hora Máquina Trabalhada (e qualquer futuro template com maquinas mas
    // sem data_execucao cai aqui como fallback razoável)
    if (a.maquinas && a.maquinas.length){
      var maqs = (a.maquinas||[]).map(function(m){
        var d = m.dados || {};
        var horaTxt = (d.hora_inicial!=null || d.hora_final!=null)
          ? ((d.hora_inicial!=null?d.hora_inicial:"—")+"h → "+(d.hora_final!=null?d.hora_final:"—")+"h")
          : renderMaquinaDadosGenerico(d);
        return '<div class="item"><label>'+esc(m.equipamento)+' — '+esc(m.operador)+'</label><span class="v">'+horaTxt+'</span></div>';
      }).join("");
      return '<div class="campos">'+
        '<div class="item"><label>Tipo</label><span class="v">'+esc(a.tipo||"—")+'</span></div>'+
      '</div>'+
      '<p class="lista-inline"><strong>Observação:</strong> '+esc(a.observacao||"—")+'</p>'+
      '<div class="campos" style="margin-top:10px;">'+maqs+'</div>';
    }
    var eqs = (a.equipamentos||[]).map(function(e){ return esc(e.equipamento)+' ('+esc(e.operador)+')'; }).join(", ");
    return '<div class="campos">'+
      '<div class="item"><label>Comprimento</label><span class="v">'+(a.comprimento_m!=null?a.comprimento_m+"m":"—")+'</span></div>'+
      '<div class="item"><label>Largura</label><span class="v">'+(a.largura_m!=null?a.largura_m+"m":"—")+'</span></div>'+
      '<div class="item"><label>Profundidade</label><span class="v">'+(a.profundidade_cm!=null?a.profundidade_cm+"cm":"—")+'</span></div>'+
      (a.dmt_km_inicial!=null ? '<div class="item"><label>DMT</label><span class="v">'+a.dmt_km_inicial+' a '+a.dmt_km_final+' km</span></div>' : '')+
      '<div class="item"><label>Trecho</label><span class="v">'+esc(a.trecho||"—")+'</span></div>'+
    '</div>'+
    '<p class="lista-inline"><strong>Equipamentos:</strong> '+(eqs||"—")+'</p>'+
    '<p class="lista-inline"><strong>Observação:</strong> '+esc(a.observacao||"—")+'</p>';
  }
  function renderTelaDetalhe(){
    var r = App.relatorios.filter(function(x){ return x.id === App.relatorioAtualId; })[0];
    if (!r) return '<div class="empty-state">Relatório não encontrado.</div>';
    var html = '<button class="back-link" id="btn-voltar-dashboard">'+backIcon()+' Voltar</button>';
    html += '<div class="detalhe-grid">'+
      ['cliente','contrato','faena','tipo_estrada','equipe_frente','fazenda','encarregado','supervisor','tecnico_arauco','supervisor_arauco'].map(function(k){
        var labels = { cliente:"Cliente", contrato:"Contrato", faena:"Faena", tipo_estrada:"Tipo de estrada", equipe_frente:"Equipe/Frente",
          fazenda:"Fazenda", encarregado:"Encarregado", supervisor:"Supervisor", tecnico_arauco:"Técnico Arauco", supervisor_arauco:"Supervisor Arauco" };
        return '<div class="info-card"><label>'+labels[k]+'</label><div class="val">'+esc(r[k]||"—")+'</div></div>';
      }).join("")+
      '<div class="info-card"><label>Data</label><div class="val">'+formatarData(r.data_relatorio)+'</div></div>'+
      '<div class="info-card"><label>Status</label><div class="val"><span class="badge sincronizado">Sincronizado</span></div></div>'+
    '</div>';

    if (r.gps_lat != null){
      html += '<div class="info-card" style="margin-bottom:22px;"><label>'+pinIcon()+' Localização da frente</label>'+
        '<div class="val">'+r.gps_lat.toFixed(6)+', '+r.gps_lng.toFixed(6)+' — '+
        '<a href="https://www.google.com/maps?q='+r.gps_lat+','+r.gps_lng+'" target="_blank" rel="noopener" style="color:var(--brand);">Ver no mapa</a></div></div>';
    }

    // As removidas continuam vindo do banco de propósito (é o ponto da
    // marcação), mas contá-las junto com as vivas daria um total que não bate
    // com o que o operador tem na mão. Então o título separa as duas coisas.
    var ativs      = r.atividades || [];
    var qtdVivas   = ativs.filter(function(a){ return !a.excluido_em; }).length;
    var qtdRemovidas = ativs.length - qtdVivas;
    html += '<div class="section-title">Atividades ('+qtdVivas+
      (qtdRemovidas ? ' + '+qtdRemovidas+' removida'+(qtdRemovidas > 1 ? 's' : '')+' pelo operador' : '')+
      ')</div>';

    html += ativs.map(function(a){
      var fotos = (a.fotos||[]).map(function(f){
        return '<img src="'+urlFotoPublica(f.storage_path)+'" data-full="'+urlFotoPublica(f.storage_path)+'">';
      }).join("");
      var status   = a.status_revisao || "pendente";
      var removida = !!a.excluido_em;

      // Numa atividade removida o badge de revisão informa o que ela ERA --
      // status_anterior_exclusao vem do banco justamente pra isso. Mostrar
      // "Pendente" numa linha que não existe mais no aparelho seria mentira.
      var badge = removida ? '<span class="badge-revisao removido">Removida no aparelho</span>'
        : status === "validado" ? '<span class="badge-revisao validado">Validado</span>'
        : status === "devolvido" ? '<span class="badge-revisao devolvido">Devolvido</span>'
        : '<span class="badge-revisao pendente">Pendente de revisão</span>';

      var avisoRemocao = "";
      if (removida){
        var antes = a.status_anterior_exclusao || status;
        var comoEstava = antes === "validado" ? "já estava VALIDADA por você"
          : antes === "devolvido" ? "estava DEVOLVIDA aguardando correção"
          : "ainda não tinha sido revisada";
        avisoRemocao = '<div class="ativ-aviso-remocao">'+
          'O operador removeu este apontamento em '+esc(formatarDataHora(a.excluido_em))+'. '+
          'Quando foi removida, '+comoEstava+'. '+
          'Os dados e as fotos continuam guardados aqui.'+
        '</div>';
      }

      return '<div class="ativ-detalhe'+(removida ? ' removida' : '')+'" data-atividade-id="'+a.id+'">'+
        '<div class="top"><span class="tipo">'+esc(a.tipo_atividade)+'</span>'+badge+'</div>'+
        renderResumoAtividade(a)+
        (fotos ? '<div class="fotos-grid">'+fotos+'</div>' : '')+
        (!removida && status === "devolvido" && a.motivo_devolucao ? '<div class="ativ-motivo-devolucao">Motivo da devolução: '+esc(a.motivo_devolucao)+'</div>' : '')+
        avisoRemocao+
        // Sem botões nas removidas: validar ou devolver algo que não está mais
        // no aparelho não leva a lugar nenhum -- o operador não veria. O banco
        // não impede (as RPCs continuam aceitando), é a tela que não oferece.
        (removida ? '' :
          '<div class="ativ-acoes-revisao">'+
            '<button class="btn-tabela" data-id="'+a.id+'" data-action="validar-atividade">Validar</button>'+
            '<button class="btn-tabela perigo" data-id="'+a.id+'" data-action="devolver-atividade">Devolver</button>'+
          '</div>')+
      '</div>';
    }).join("");

    return html;
  }

      '<button class="btn btn-primary" id="modal-salvar-edicao" style="flex:1">Salvar</button></div>'
    );
    document.getElementById("modal-cancel").onclick = hideModal;
    var input = document.getElementById("cad-edit-valor");
    function salvar(){
      var novoValor = input.value.trim();
      if (!novoValor){ showToast("Digite um valor."); return; }
      salvarCadastro(item.id, item.categoria, novoValor, item.ativo, item.ordem).then(function(ok){
        if (ok){ hideModal(); showToast("Atualizado."); }
      });
    }
    document.getElementById("modal-salvar-edicao").onclick = salvar;
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") salvar(); });
    input.focus();
  }
  // Exporta um .xlsx com uma coluna por categoria (cabeçalho = nome amigável),
  // já preenchida com os valores ativos de hoje -- serve tanto pra carga
  // inicial (planilha em branco, cada um preenche a sua coluna) quanto pra
  // revisar/adicionar em cima do que já existe.
  function gerarModeloCadastros(){
    var linhas = CATEGORIA_ORDEM.map(function(cat){
      return App.cadastrosAdmin.filter(function(c){ return c.categoria === cat && c.ativo; }).map(function(c){ return c.valor; });
    });
    var maxLinhas = Math.max.apply(null, linhas.map(function(l){ return l.length; }).concat([0]));
    var aoa = [CATEGORIA_ORDEM.map(function(cat){ return CATEGORIA_LABELS[cat]; })];
    for (var i = 0; i < maxLinhas; i++){
      aoa.push(linhas.map(function(l){ return l[i] || ""; }));
    }
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = CATEGORIA_ORDEM.map(function(){ return { wch: 24 }; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Cadastros");
    XLSX.writeFile(wb, "modelo_cadastros_gtm.xlsx");
  }

  // Lê o mesmo formato de volta: cada coluna é uma categoria (identificada
  // pelo cabeçalho amigável, não pela posição -- assim não quebra se
  // alguém reordenar as colunas na planilha). Cada célula preenchida abaixo
  // do cabeçalho vira um cadastro novo; duplicado é ignorado no servidor,
  // não dá erro nem cadastra de novo.
  var LABEL_PARA_CATEGORIA = {};
  CATEGORIA_ORDEM.forEach(function(cat){ LABEL_PARA_CATEGORIA[CATEGORIA_LABELS[cat]] = cat; });

  function importarModeloCadastros(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var itens = [];
      var colunasIgnoradas = [];
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        var cabecalho = aoa[0] || [];
        cabecalho.forEach(function(label, colIdx){
          var categoria = LABEL_PARA_CATEGORIA[String(label).trim()];
          if (!categoria){ if (label) colunasIgnoradas.push(label); return; }
          for (var linha = 1; linha < aoa.length; linha++){
            var valor = String(aoa[linha][colIdx] || "").trim();
            if (valor) itens.push({ categoria: categoria, valor: valor });
          }
        });
      } catch(err){
        showToast("Não consegui ler o arquivo. Confirme que é o modelo exportado daqui.");
        return;
      }
      if (!itens.length){
        showToast("Nenhum valor encontrado no arquivo.");
        return;
      }
      showConfirm(
        "Importar " + itens.length + " valor(es)?",
        "Valores que já existem são ignorados automaticamente, sem duplicar." +
        (colunasIgnoradas.length ? " Colunas não reconhecidas (ignoradas): " + colunasIgnoradas.join(", ") + "." : ""),
        "Importar",
        function(){
          supabaseClient.rpc("importar_cadastros_lote", { p_itens: itens }).then(function(resp){
            if (resp.error){ showToast("Erro ao importar: " + resp.error.message); return; }
            var r = resp.data;
            showToast(r.inseridos + " novo(s) cadastrado(s), " + r.ja_existiam + " já existiam.");
            carregarCadastrosAdmin();
          });
        }
      );
    };
    reader.readAsArrayBuffer(file);
  }
  function ligarTelaCadastros(){
    document.getElementById("btn-gerar-modelo").onclick = gerarModeloCadastros;
    var inputImportar = document.getElementById("input-importar-modelo");
    document.getElementById("btn-importar-modelo").onclick = function(){ inputImportar.click(); };
    inputImportar.onchange = function(){
      if (inputImportar.files[0]) importarModeloCadastros(inputImportar.files[0]);
      inputImportar.value = "";
    };
    document.querySelectorAll(".cad-sidebar-item").forEach(function(btn){
      btn.onclick = function(){ App.categoriaAtiva = btn.getAttribute("data-cat"); App.cadastrosPagina = 1; render(); };
    });
    var btnPagPrimeira = document.getElementById("btn-pagina-primeira");
    if (btnPagPrimeira) btnPagPrimeira.onclick = function(){ App.cadastrosPagina = 1; render(); };
    var btnPagAnterior = document.getElementById("btn-pagina-anterior");
    if (btnPagAnterior) btnPagAnterior.onclick = function(){ App.cadastrosPagina = Math.max(1, App.cadastrosPagina-1); render(); };
    var btnPagProxima = document.getElementById("btn-pagina-proxima");
    if (btnPagProxima) btnPagProxima.onclick = function(){ App.cadastrosPagina = App.cadastrosPagina+1; render(); };
    var btnPagUltima = document.getElementById("btn-pagina-ultima");
    if (btnPagUltima) btnPagUltima.onclick = function(){
      var total = App.cadastrosAdmin.filter(function(c){ return c.categoria === App.categoriaAtiva; }).length;
      App.cadastrosPagina = Math.max(1, Math.ceil(total / App.cadastrosTamanhoPagina));
      render();
    };
    var selTamanhoPagina = document.getElementById("cad-tamanho-pagina");
    if (selTamanhoPagina) selTamanhoPagina.onchange = function(){
      App.cadastrosTamanhoPagina = Number(this.value);
      App.cadastrosPagina = 1;
      render();
    };
    var btnAdd = document.getElementById("btn-cad-add");
    var inputNovo = document.getElementById("cad-novo-valor");
    function adicionar(){
      var valor = inputNovo.value.trim();
      if (!valor){ showToast("Digite um valor."); return; }
      salvarCadastro(null, App.categoriaAtiva, valor, true, 0).then(function(ok){
        if (ok) showToast("Adicionado.");
      });
    }
    btnAdd.onclick = adicionar;
    inputNovo.addEventListener("keydown", function(e){ if (e.key === "Enter") adicionar(); });

    document.querySelectorAll('[data-action="editar"]').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-id");
        var item = App.cadastrosAdmin.filter(function(c){ return c.id === id; })[0];
        if (item) abrirEdicaoCadastro(item);
      };
    });
    document.querySelectorAll('[data-action="desativar"]').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-id");
        showConfirm("Desativar este valor?", "Ele deixa de aparecer no PWA de campo, mas relatórios antigos que já usaram continuam intactos.", "Desativar", function(){
          excluirCadastro(id).then(function(ok){ if (ok) showToast("Desativado."); });
        });
      };
    });
    document.querySelectorAll('[data-action="reativar"]').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-id");
        var item = App.cadastrosAdmin.filter(function(c){ return c.id === id; })[0];
        if (!item) return;
        salvarCadastro(id, item.categoria, item.valor, true, item.ordem).then(function(ok){ if (ok) showToast("Reativado."); });
      };
    });
  }

  /* ======================= RENDER: CONFIGURAÇÕES ======================= */
  var FORMULARIOS_DISPONIVEIS = [
    { id:"padrao", label:"Padrão (obra)" },
    { id:"hora_maquina", label:"Hora Máquina" },
    { id:"maquinas_detalhado", label:"Máquinas Detalhado" }
  ];
  // Campos que podem ter obrigatoriedade configurada por cliente. Cresce só
  // adicionando um nome aqui -- o PWA já sabe ler qualquer chave nova via
  // campoObrigatorioPara(cliente, campo), sem precisar de mais código lá.
  // Mesmos nomes usados em NOME_REGRA_CAMPO no PWA (index.html) -- os dois
  // lados precisam usar o texto idêntico, já que a chave da regra é
  // literalmente "Cliente:NomeDoCampo". Equipamento/Operador ficam de fora
  // de propósito -- sempre obrigatórios, sem opção de tornar opcional.
  var CAMPOS_CONFIGURAVEIS = ["UP", "Trecho", "Comprimento", "Largura", "Profundidade", "DMT", "Tipo", "Quantidade", "Hora Inicial", "Hora Final", "Observação"];
  // Quais desses campos existem de verdade em cada formulário -- usado só
  // pra FILTRAR a matriz quando uma atividade específica está selecionada
  // (não faz sentido oferecer "Comprimento" pra configurar numa atividade
  // que usa o formulário Hora Máquina, que nem tem esse campo).
  var CAMPOS_POR_FORMULARIO = {
    padrao: ["UP", "Trecho", "Comprimento", "Largura", "Profundidade", "DMT", "Observação"],
    hora_maquina: ["Tipo", "Hora Inicial", "Hora Final", "Observação"],
    maquinas_detalhado: ["UP", "Trecho", "Quantidade", "Comprimento", "Largura", "Profundidade", "Hora Inicial", "Hora Final", "Observação"]
  };

  // Compartilhado entre render e wiring -- assim o botão "marcar/desmarcar
  // coluna toda" sabe exatamente a mesma lista de campos que está na tela
  // (respeitando o filtro de atividade), sem duplicar a lógica.
  function configContextoAtual(){
    var atividadeSel = App.configAtividadeSelecionada;
    var prefixoChave = atividadeSel ? (atividadeSel+":") : "";
    var formularioSel = atividadeSel ? valorRegra("formulario_atividade", atividadeSel, "padrao") : null;
    var camposMostrados = atividadeSel
      ? CAMPOS_CONFIGURAVEIS.filter(function(c){ return (CAMPOS_POR_FORMULARIO[formularioSel]||[]).indexOf(c) !== -1; })
      : CAMPOS_CONFIGURAVEIS;
    return { atividadeSel: atividadeSel, prefixoChave: prefixoChave, camposMostrados: camposMostrados };
  }

  function renderTelaConfiguracoes(){
    if (!App.cadastrosCarregados || !App.regrasCarregadas){
      return '<div class="spinner-wrap"><div class="spinner"></div></div>';
    }
    var atividades = App.cadastrosAdmin.filter(function(c){ return c.categoria === "tipo_atividade" && c.ativo; });
    var clientes = App.cadastrosAdmin.filter(function(c){ return c.categoria === "cliente" && c.ativo; });

    var html = '<div class="config-row">';

    html += '<div class="config-section">';
    html += '<div class="section-title" style="margin-top:0">Formulário por atividade</div>';
    html += '<p class="helper-text" style="margin-top:0">Define qual formulário o PWA de campo mostra quando essa atividade é selecionada.</p>';
    html += '<div class="tabela-wrap tabela-estreita"><table><thead><tr><th>Atividade</th><th>Formulário</th></tr></thead><tbody>';
    html += atividades.map(function(a){
      var atual = valorRegra("formulario_atividade", a.valor, "padrao");
      return '<tr><td>'+esc(a.valor)+'</td><td>'+
        '<select class="filtro-campo-select" data-atividade="'+esc(a.valor)+'">'+
        FORMULARIOS_DISPONIVEIS.map(function(f){
          return '<option value="'+f.id+'"'+(atual===f.id?" selected":"")+'>'+f.label+'</option>';
        }).join("")+
        '</select></td></tr>';
    }).join("")+'</tbody></table></div>';
    html += '</div>';

    html += '<div class="config-section">';
    html += '<div class="section-title" style="margin-top:0">Campos obrigatórios por cliente</div>';
    html += '<p class="helper-text" style="margin-top:0">Marcado = obrigatório no PWA para esse cliente. Sem marcação em nenhum cliente, o campo fica obrigatório por padrão. Escolha uma atividade específica pra abrir uma exceção só pra ela -- sem escolher, a regra é "Geral" e vale pra qualquer atividade que tenha aquele campo.</p>';
    html += '<div class="field" style="max-width:320px; margin-bottom:14px;"><label>Aplicar para</label>'+
      '<select id="config-atividade-select" class="filtro-campo-select" style="width:100%;">'+
      '<option value=""'+(App.configAtividadeSelecionada===""?" selected":"")+'>Geral (todas as atividades)</option>'+
      atividades.map(function(a){
        return '<option value="'+esc(a.valor)+'"'+(App.configAtividadeSelecionada===a.valor?" selected":"")+'>'+esc(a.valor)+'</option>';
      }).join("")+
      '</select></div>';

    if (!clientes.length){
      html += '<div class="empty-state">Cadastre ao menos um cliente antes de configurar isso.</div>';
    } else {
      var ctx = configContextoAtual();
      var prefixoChave = ctx.prefixoChave;
      var camposMostrados = ctx.camposMostrados;

      if (!camposMostrados.length){
        html += '<div class="empty-state">Essa atividade não tem campo configurável (formulário sem campos opcionais).</div>';
      } else {
        html += '<div class="tabela-wrap tabela-matriz-scroll"><table class="tabela-matriz"><thead><tr><th>Campo</th>'+
          clientes.map(function(c){
            return '<th><div class="th-cliente">'+esc(c.valor)+'</div>'+
              '<div class="th-acoes-coluna">'+
                '<button class="btn-coluna" data-cliente="'+esc(c.valor)+'" data-marcar="true">Marcar todos</button>'+
                '<button class="btn-coluna" data-cliente="'+esc(c.valor)+'" data-marcar="false">Desmarcar todos</button>'+
              '</div></th>';
          }).join("")+
          '</tr></thead><tbody>'+
          camposMostrados.map(function(campo){
            return '<tr><td>'+esc(campo)+'</td>'+
              clientes.map(function(c){
                var chave = c.valor+":"+prefixoChave+campo;
                var marcado = valorRegra("campo_obrigatorio", chave, true);
                return '<td><input type="checkbox" data-chave="'+esc(chave)+'" '+(marcado?"checked":"")+'></td>';
              }).join("")+
            '</tr>';
          }).join("")+
          '</tbody></table></div>';
      }
    }
    html += '</div></div>';
    return html;
  }
  function ligarTelaConfiguracoes(){
    var selAtividade = document.getElementById("config-atividade-select");
    if (selAtividade) selAtividade.onchange = function(){
      App.configAtividadeSelecionada = this.value;
      render();
    };
    document.querySelectorAll('select[data-atividade]').forEach(function(sel){
      sel.onchange = function(){
        salvarRegra("formulario_atividade", sel.getAttribute("data-atividade"), sel.value).then(function(ok){
          if (ok) showToast("Formulário atualizado.");
        });
      };
    });
    document.querySelectorAll('input[type="checkbox"][data-chave]').forEach(function(chk){
      chk.onchange = function(){
        salvarRegra("campo_obrigatorio", chk.getAttribute("data-chave"), chk.checked).then(function(ok){
          if (ok) showToast("Configuração salva.");
        });
      };
    });
    document.querySelectorAll(".btn-coluna").forEach(function(btn){
      btn.onclick = function(){
        var cliente = btn.getAttribute("data-cliente");
        var marcar = btn.getAttribute("data-marcar") === "true";
        var ctx = configContextoAtual();
        var chaves = ctx.camposMostrados.map(function(campo){ return cliente+":"+ctx.prefixoChave+campo; });
        if (!chaves.length) return;
        Promise.all(chaves.map(function(chave){ return salvarRegraSilenciosa("campo_obrigatorio", chave, marcar); })).then(function(resultados){
          var ok = resultados.filter(Boolean).length;
          carregarRegrasAdmin();
          showToast(ok+" de "+chaves.length+" campo(s) atualizados para "+cliente+".");
        });
      };
    });
  }

  /* ======================= RENDER PRINCIPAL ======================= */
  function render(){
    var app = document.getElementById("app");
    // O innerHTML abaixo apaga o div do mapa; se houver instância Leaflet
    // ativa, precisa dar remove() antes pra não deixar handlers órfãos nem
    // o erro "map container is already initialized" no próximo render.
    if (_leafletMap){ try { _leafletMap.remove(); } catch(e){} _leafletMap = null; }
    var mainHtml = "";
    if (App.tela === "carregando"){
      mainHtml = '<div class="spinner-wrap" style="height:100vh;"><div class="spinner"></div></div>';
      app.innerHTML = mainHtml;
      return;
    }
    if (App.tela === "login") mainHtml = renderTelaLogin();
    else if (App.tela === "mfa-enroll") mainHtml = renderTelaMfaEnroll();
    else if (App.tela === "mfa-verify") mainHtml = renderTelaMfaVerify();
    else if (App.tela === "dashboard") mainHtml = renderDashboard();
    else if (App.tela === "detalhe") mainHtml = renderTelaDetalhe();
    else if (App.tela === "cadastros") mainHtml = renderTelaCadastros();
    else if (App.tela === "configuracoes") mainHtml = renderTelaConfiguracoes();

    var sidebar = renderSidebar();
    if (sidebar){
      app.innerHTML = sidebar + '<main class="app-main">'+mainHtml+'</main>';
      ligarSidebar();
    } else {
      app.innerHTML = mainHtml;
    }

    if (App.tela === "login") ligarTelaLogin();
    else if (App.tela === "mfa-enroll") ligarTelaMfa("enroll");
    else if (App.tela === "mfa-verify") ligarTelaMfa("verify");
    else if (App.tela === "dashboard") ligarDashboard();
    else if (App.tela === "detalhe") ligarTelaDetalhe();
    else if (App.tela === "cadastros") ligarTelaCadastros();
    else if (App.tela === "configuracoes") ligarTelaConfiguracoes();
  }

  /* ======================= INIT ======================= */
  var temaSalvo = localStorage.getItem("gtm_painel_tema");
  document.documentElement.setAttribute("data-theme", temaSalvo || "light");

  if (!supabaseClient){
    App.tela = "login";
    App.erroAuth = "Não foi possível carregar o cliente Supabase. Recarregue a página.";
    render();
  } else {
    supabaseClient.auth.getSession().then(function(resp){
      var session = resp.data && resp.data.session;
      if (session){
        // já tem sessão -- ainda assim exige o desafio de MFA se aal atual for aal1
        var aal = (session.user && session.user.aal) || null;
        supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel().then(function(nivel){
          if (nivel.data && nivel.data.currentLevel === "aal2"){
            entrarNoPainel();
          } else {
            prosseguirAposSenha();
          }
        });
      } else {
        App.tela = "login";
        render();
      }
    });
  }
})();
</script>
</body>
